<!-- @dsCard height=288 -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface-000);color:var(--ink);font-family:var(--font-sans)}
.text{position:absolute;left:48px;bottom:40px;width:440px}
.name{margin:0;font-size:96px;line-height:.95;font-weight:600;letter-spacing:-.01em}
.tag{margin:8px 0 0;font-size:14px;line-height:20px;color:var(--ink-muted)}
svg{position:absolute;left:480px;top:0}
.accent{fill:var(--accent)}.ink{fill:var(--ink)}.soft{fill:var(--accent-soft);stroke:var(--hairline);stroke-width:1}.warn{fill:var(--warn)}
.outline{fill:none;stroke:var(--ink);stroke-width:2}.dot{fill:var(--hairline)}
.sm{rx:var(--radius-sm)}.md{rx:var(--radius-md)}.lg{rx:var(--radius-lg)}
</style></head><body>
<div class="cover">
<div class="text"><h1 class="name">Bauherr</h1><p class="tag">The factory works. You sign off.</p></div>
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
<!-- Blocks: ink outline 192 (space-12 x 4), accent 96, ink 48 (space-12), accent-soft 96, warn 24 (space-6). -->
<!-- Arrangement: cornerstone at left (accent in the outline's bottom-left corner), three satellites staggered right, all bottoms on y=240. -->
<!-- Pattern: 12x6 dot row at 16px pitch in hairline above the satellites; README: "Hairlines, not shadows." -->
<!-- Steps: 24, 48, 96, 192 (multiples of the 4px grid); radii: sm on warn, md on ink, lg on large blocks. -->
<defs><pattern id="d" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="dot" cx="8" cy="8" r="1.5"/></pattern></defs>
<rect class="outline lg" x="49" y="49" width="190" height="190"/>
<rect class="accent lg" x="48" y="144" width="96" height="96"/>
<rect fill="url(#d)" x="256" y="48" width="192" height="96"/>
<rect class="ink md" x="264" y="192" width="48" height="48"/>
<rect class="soft lg" x="336" y="144" width="96" height="96"/>
<rect class="warn sm" x="444" y="216" width="24" height="24"/>
</svg>
</div></body></html>
