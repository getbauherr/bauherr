<!doctype html><html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);background:var(--surface-000);color:var(--ink);font-family:var(--font-sans)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important}}
.row{display:flex;gap:var(--space-2);align-items:center}
.btn{height:36px;padding:0 var(--space-3);border-radius:var(--radius-md);border:1px solid var(--hairline);background:var(--surface-100);color:var(--ink);font:inherit;font-size:15px;line-height:22px;font-weight:500;cursor:pointer;transition:background-color var(--duration-state) var(--ease-out),border-color var(--duration-state) var(--ease-out)}
.btn:hover{background-color:var(--surface-200)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.primary:hover{background-color:color-mix(in srgb,var(--accent),var(--ink) 15%)}
.danger{color:var(--danger)}
.btn:disabled{background:var(--surface-200);color:var(--ink-muted);cursor:not-allowed}
</style></head><body>
<div class="row">
<button class="btn primary">Approve plan</button>
<button class="btn">Ask for changes</button>
<button class="btn danger">Cancel run</button>
<button class="btn" disabled>Re-run failed steps</button>
</div></body></html>
