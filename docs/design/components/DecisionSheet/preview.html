<!-- @dsCard group="Decisions" height=300 -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;padding:var(--space-4);background:var(--surface-000);color:var(--ink);font-family:var(--font-sans)}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important}}
.sheet{max-width:640px;background:var(--surface-100);border:1px solid var(--hairline);border-radius:var(--radius-md);overflow:hidden}
table{width:100%;border-collapse:collapse;text-align:left}
th{background:var(--surface-200);color:var(--ink-muted);padding:var(--space-2) var(--space-3);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
td{padding:var(--space-2) var(--space-3);border-top:1px solid var(--hairline);vertical-align:top;font-size:15px;line-height:22px;color:var(--ink);transition:background-color var(--duration-state) var(--ease-out)}
tr:hover td{background:var(--accent-soft)}
td.n,th.n{width:40px;font-family:var(--font-mono);font-size:13px}
.crit{display:block;color:var(--warn);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.opts{display:flex;gap:var(--space-4);margin-top:var(--space-1);font-size:13px;line-height:18px}
.opt{display:inline-flex;align-items:center;gap:var(--space-1)}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-muted)}
.radio.on{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 3px,transparent 3.5px)}
.def{font-family:var(--font-mono);font-size:13px;line-height:20px;color:var(--ink-muted)}
.foot{padding:var(--space-2) var(--space-3);border-top:1px solid var(--hairline);color:var(--ink-muted);font-size:13px;line-height:18px}
</style></head><body>
<div class="sheet">
<table>
<tr><th class="n">#</th><th>Decision</th><th>Default</th></tr>
<tr><td class="n">1</td><td>Which database holds the audit trail?
<div class="opts"><span class="opt"><span class="radio"></span>PostgreSQL</span><span class="opt"><span class="radio on"></span>SQLite</span></div></td><td class="def">PostgreSQL</td></tr>
<tr><td class="n">2</td><td>Delete data older than the retention window?<span class="crit">★ critical</span></td><td class="def">keep</td></tr>
<tr><td class="n">3</td><td>Run snapshot tests on both device sizes?</td><td class="def">both</td></tr>
<tr><td class="n">4</td><td>Send the failure summary by email?<span class="crit">★ critical</span></td><td class="def">no</td></tr>
</table>
<div class="foot">Unanswered rows take their default.</div>
</div></body></html>
