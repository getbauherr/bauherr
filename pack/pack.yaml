name: core
version: 0.1.0
description: Bauherr core pack.
roles:
  builder: {tier: standard}
  verifier: {tier: strong}
  reviewer: {tier: strong}
rules:
  - {path: rules/no-comments.md, purpose: No code comments; the allowlist, and encode the reason as a name, type, test or check}
skills:
  - {path: skills/intake.md, purpose: Decide whether an issue becomes work; ask in one numbered round with suggested answers}
  - {path: skills/brief.md, purpose: Turn an accepted issue into criteria a user can observe, with risk and plan}
  - {path: skills/build.md, purpose: Implement the Brief, self check each criterion, hand off to a verifier}
  - {path: skills/review.md, purpose: Review a patch you did not build from the diff; every finding needs a failing test or a reproduction}
  - {path: skills/verify.md, purpose: Verify from evidence as a non-author; findings need a test or reproduction}
  - {path: skills/learn.md, purpose: Read the corrections of a finished ticket and write what the next agent must know, one rule per lesson, matching an existing memory first}
