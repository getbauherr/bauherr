# Setup preset "Careful": the Standard factory plus Accept on staging (`gate: human` on `release`) and three specialist reviews between Build and Review,
# each only when the change needs it (`when`): security when it touches the Product's `security` paths, UX when it touches its `ui` paths, the test specialist for bugs.
# A step that does not match is skipped; `pass` goes on, `findings` back to build. Applied by /setup. Spec: docs/spec/workflow.md
version: 1
team:
  roles:
    orchestrator: {title: Orchestrator, skills: [Triage, Routing, Unblocking], tier: cheap, exceptions: true, profile_file: roles/orchestrator.md}
    engineer:     {title: Software engineer, skills: [Implementation, Small diffs, Tests first, Refactoring], tier: cheap, profile_file: roles/engineer.md}
    reviewer:     {title: Reviewer, skills: [Diff reading, Plan conformance, Repo rules], tier: standard, profile_file: roles/reviewer.md}
    security:     {title: Security specialist, skills: [Threat modelling, AuthZ, Secrets, Injection, Dependencies], tier: standard, profile_file: roles/security.md}
    ux:           {title: UX specialist, skills: [Flows, States, Copy, Accessibility], tier: standard, profile_file: roles/ux.md}
    test:         {title: Test specialist, skills: [Failure modes, Regression, Flake hunting], tier: standard, profile_file: roles/test.md}
workflow:
  stages:
    # Tickets with any `exclude_labels` label (or an assignee) are not triaged.
    - name: triage
      kind: triage
      role: orchestrator
      skill: triage
      exclude_labels: [wayfinder:map, wayfinder:grilling, wayfinder:research, bauherr:security-scan]
      outcomes: {plan: plan, refine: triage, skip: backlog}
    - {name: plan, kind: plan, role: engineer, skill: run-contract, gate: human, wip: 3, outcomes: {done: build, split: parent, decisions: triage}}
    - {name: parent, kind: container, title: Split, outcomes: {children_done: done}}
    - {name: build, kind: build, role: engineer, skill: run-contract, wip: 2, outcomes: {done: security-review, stuck: escalate, replan: plan}}
    - {name: security-review, title: Security review, kind: agent, role: security, skill: mr-security-review, when: {touches: security}, wip: 2, outcomes: {pass: ux-review, findings: build}}
    - {name: ux-review, title: UX review, kind: agent, role: ux, skill: ux-review, when: {touches: ui}, wip: 2, outcomes: {pass: test-review, findings: build}}
    - {name: test-review, title: Test review, kind: agent, role: test, skill: test-review, when: {types: [bug]}, wip: 2, outcomes: {pass: review, findings: build}}
    - {name: review, kind: review, role: reviewer, skill: review, wip: 3, outcomes: {clean: release, changes: build, stop: triage}}
    - {name: release, kind: release, title: Staging, gate: human, wip: 5, production_gate: human, outcomes: {accepted: done, changes: build}}
    - {name: done, kind: done}
