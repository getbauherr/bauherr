# Setup preset "Careful": the Standard factory plus Accept on staging (`gate: human` on `release`). Applied by /setup. Spec: docs/spec/workflow.md
# Specialist Jobs of `review` run only when needed (`when`): security on the Product's `security` paths, UX on its `ui` paths, test for bugs.
version: 1
team:
  roles:
    orchestrator: {title: Orchestrator, skills: [Triage, Routing, Unblocking], tier: cheap, exceptions: true, profile_file: roles/orchestrator.md}
    engineer:     {title: Software engineer, skills: [Implementation, Small diffs, Tests first, Refactoring], tier: standard, profile_file: roles/engineer.md}
    reviewer:     {title: Reviewer, skills: [Diff reading, Plan conformance, Repo rules], tier: strong, profile_file: roles/reviewer.md}
    security:     {title: Security specialist, skills: [Threat modelling, AuthZ, Secrets, Injection, Dependencies], tier: standard, profile_file: roles/security.md}
    ux:           {title: UX specialist, skills: [Flows, States, Copy, Accessibility], tier: standard, profile_file: roles/ux.md}
    test:         {title: Test specialist, skills: [Failure modes, Regression, Flake hunting], tier: standard, profile_file: roles/test.md}
    docs:         {title: Technical writer, skills: [Doc freshness, Claim checking, Gap finding], tier: standard, profile_file: roles/docs.md}
    ax:           {title: Agent experience engineer, skills: [Trust pyramid, Guard checks, Verification, Feature map], tier: strong, profile_file: roles/ax.md}
    verifier:     {title: Finding verifier, skills: [Evidence, Reproduction], tier: strong, profile_file: roles/verifier.md}
workflow:
  stages:
    # Tickets with any `exclude_labels` label (or an assignee) are not triaged.
    - name: triage
      kind: triage
      role: orchestrator
      skill: triage
      refine: {by: product-owner}
      exclude_labels: [wayfinder:map, wayfinder:grilling, wayfinder:research, bauherr:security-scan, bauherr:docs-check]
      outcomes: {plan: plan, refine: triage, skip: backlog}
    - {name: plan, kind: plan, role: engineer, skill: run-contract, wip: 4, jobs: [{id: plan}, {id: ax-scan, role: ax, skill: harden, needs: [plan], blocking: false, outcomes: {pass: done, findings: done}}, {id: approve, kind: human, by: bauherr, needs: [plan, ax-scan]}], outcomes: {done: build, split: parent, decisions: triage}}
    - {name: parent, kind: container, title: Split, outcomes: {children_done: done}}
    - {name: build, kind: build, role: engineer, skill: run-contract, wip: 2, outcomes: {done: review, stuck: escalate, replan: plan}}
    - {name: review, kind: review, role: reviewer, skill: review-rank, wip: 3, jobs: [{id: correctness, role: reviewer, skill: review}, {id: security, role: security, skill: mr-security-review, when: {touches: security}}, {id: ux, role: ux, skill: ux-review, when: {touches: ui}}, {id: test, role: test, skill: test-review, when: {types: [bug]}}, {id: ax, role: ax, skill: harden}, {id: verify, role: verifier, skill: verify-findings, needs: [correctness, security, ux, test, ax]}, {id: owner-review, kind: human, by: bauherr, when: {touches: red}, needs: [verify]}, {id: review, needs: [verify, owner-review]}], outcomes: {clean: release, changes: build, stop: triage}}
    - {name: release, kind: release, title: Staging, gate: human, wip: 5, production_gate: human, jobs: [{id: staging-walk, role: ax, skill: verify-maintain, outcomes: {pass: done, findings: changes}}], outcomes: {accepted: done, changes: build}}
    - {name: done, kind: done}
