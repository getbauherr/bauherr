# The factory: the team and the workflow. Spec: docs/spec/workflow.md
# Optional per stage: `mode: session|autonomous` (default autonomous). Workspace.modeByStage / defaultMode and
# env BAUHERR_DEFAULT_MODE override it (apps/server/src/lib/mode.ts).
# Human gates: refine (Triage questions) is always on; production is on by default (`production_gate: human` on `release`;
# a Product without productionChecks shows the "Configure production checks" gate until they are set).
# Approve plan (`gate: human` on `plan`) is on by default: every plan waits for the Bauherr. Remove it in your own factory file to let plans through.
# Who is asked (docs/spec/people.md): `gate: human` asks the Bauherr, `gate: {by: bauherr | product-owner}` names the person; the same on `production_gate`, `refine: {by: ...}` on triage and `by:` on a `human` stage.
# The Product owner answers Triage's questions and accepts on staging (`gate: {by: product-owner}` on `release`, per Product: only where the Product owner tests on staging is switched on and one is assigned); the Bauherr approves plans and production.
# Where a checkpoint asks the Product owner and the Product has none assigned, the Bauherr is asked. A Bauherr or Admin can always decide in the Product owner's place.
version: 1
team:
  roles:
    orchestrator: {title: Orchestrator, skills: [Triage, Routing, Unblocking], tier: cheap, exceptions: true, profile_file: roles/orchestrator.md}
    engineer:     {title: Software engineer, skills: [Implementation, Small diffs, Tests first, Refactoring], tier: standard, profile_file: roles/engineer.md}
    reviewer:     {title: Reviewer, skills: [Diff reading, Plan conformance, Repo rules], tier: strong, profile_file: roles/reviewer.md}
    security:     {title: Security specialist, skills: [Threat modelling, AuthZ, Secrets, Injection, Dependencies], tier: standard, profile_file: roles/security.md}
    ux:           {title: UX specialist, skills: [Flows, States, Copy, Accessibility], tier: standard, profile_file: roles/ux.md}
    test:         {title: Test specialist, skills: [Failure modes, Regression, Flake hunting], tier: standard, profile_file: roles/test.md}
    docs:         {title: Technical writer, skills: [Doc freshness, Claim checking, Gap finding], tier: standard, profile_file: roles/docs.md}
workflow:
  stages:
    # Tickets with any `exclude_labels` label (or an assignee) are not triaged.
    - name: triage
      kind: triage
      role: orchestrator
      skill: triage
      refine: {by: product-owner}
      exclude_labels: [wayfinder:map, wayfinder:grilling, wayfinder:research, bauherr:security-scan, bauherr:docs-check]
      outcomes: {plan: plan, refine: triage, skip: backlog}
    - {name: plan, kind: plan, role: engineer, skill: run-contract, gate: human, wip: 3, outcomes: {done: build, split: parent, decisions: triage}}
    - {name: parent, kind: container, title: Split, outcomes: {children_done: done}}
    - {name: build, kind: build, role: engineer, skill: run-contract, wip: 2, outcomes: {done: security-review, stuck: escalate, replan: plan}}
    # Only when the change touches the Product's `security` paths (Product > Checks & merging > Path sets); otherwise the ticket goes straight on to review.
    - {name: security-review, title: Security review, kind: agent, role: security, skill: mr-security-review, when: {touches: security}, wip: 2, outcomes: {pass: review, findings: build}}
    - {name: review, kind: review, role: reviewer, skill: review, wip: 3, outcomes: {clean: release, changes: build, stop: triage}}
    - {name: release, kind: release, title: Staging, gate: {by: product-owner}, wip: 5, production_gate: human, outcomes: {accepted: done, changes: build}}
    - {name: done, kind: done}
