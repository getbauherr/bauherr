name: staging
# Every merge to main: build the image (a test build: the staging site runs the fake forge), start it once against a throw-away Postgres (migrates on start like compose.yaml) and report the check `staging` on that sha.
# A passing image is pushed as ghcr.io/getbauherr/bauherr:sha-<sha> and deployed to the staging site (repository variable BAUHERR_STAGING_URL) by the services pipeline; the deployment reports the commit at /api/health.
# Version images are built by release.yml and deployed to production by deploy.yml.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    # one run per sha: a shared group would drop all but the last of a burst of merges
    concurrency:
      group: staging-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    services:
      db:
        image: postgres:17
        env: {POSTGRES_USER: bauherr, POSTGRES_PASSWORD: bauherr, POSTGRES_DB: bauherr}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bauherr" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the scripts of main
        run: cp -r .github/scripts "$RUNNER_TEMP/scripts"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the test-build Dockerfile (the marker is inlined at build time and never in the shipped Dockerfile)
        run: sed 's/^COPY \. \.$/&\nARG BAUHERR_TEST_BUILD=1/' Dockerfile > "$RUNNER_TEMP/Dockerfile.staging"
      - name: Build for the smoke run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.staging
          cache-from: type=gha
          load: true
          tags: bauherr:smoke
          build-args: |
            BAUHERR_VERSION=staging
            BAUHERR_REVISION=${{ github.sha }}
      - name: Start and check /api/health
        run: |
          payload_secret=$(openssl rand -hex 32)
          encryption_key=$(openssl rand -hex 32)
          echo "::add-mask::$payload_secret"
          echo "::add-mask::$encryption_key"
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://bauherr:bauherr@127.0.0.1:5432/bauherr \
            -e PAYLOAD_SECRET="$payload_secret" -e ENCRYPTION_KEY="$encryption_key" \
            -e PUBLIC_URL=http://localhost:3000 bauherr:smoke
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/api/health | jq -e --arg commit "${GITHUB_SHA::7}" '.ok == true and .commit == $commit'
      - name: Smoke logs
        if: failure()
        run: docker logs smoke 2>&1 | tail -n 50
      - name: Push the image
        run: |
          docker tag bauherr:smoke "ghcr.io/getbauherr/bauherr:sha-$GITHUB_SHA"
          docker push "ghcr.io/getbauherr/bauherr:sha-$GITHUB_SHA"
      - name: Report check staging
        if: always()
        env:
          CHECK: staging
          SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/scripts/report-check.sh"
  deploy:
    needs: staging
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy-${{ github.sha }}
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.BAUHERR_STAGING_URL }}
    permissions:
      contents: read
    env:
      SERVICES_TRIGGER_TOKEN: ${{ secrets.SERVICES_TRIGGER_TOKEN }}
      SERVICES_TRIGGER_URL: ${{ vars.SERVICES_TRIGGER_URL }}
      SITE_URL: ${{ vars.BAUHERR_STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy the image to staging
        run: .github/scripts/trigger-services.sh staging "ghcr.io/getbauherr/bauherr:sha-$GITHUB_SHA"
      - name: Wait until staging reports this commit
        run: .github/scripts/wait-health.sh "$SITE_URL" commit "${GITHUB_SHA::7}"
