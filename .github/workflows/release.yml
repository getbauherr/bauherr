name: release
# Builds and publishes one version from its tag: image, then npm, then (final versions) the GitHub Release.
# cut-rc.yml and promote.yml start it via workflow_dispatch with the tag as --ref, because tags pushed with GITHUB_TOKEN trigger nothing.
# npm trusted publishing is bound to this file name, so the publishing jobs stay here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      built: ${{ steps.v.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Tag commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - id: v
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag (--ref vX.Y.Z)"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z[-pre]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  # One native runner per platform, in parallel; arm64 under QEMU took about 11 minutes.
  build:
    needs: version
    strategy:
      matrix:
        include:
          - {platform: linux/amd64, arch: amd64, runner: ubuntu-latest}
          - {platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/getbauherr/bauherr,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BAUHERR_VERSION=${{ needs.version.outputs.version }}
            BAUHERR_REVISION=${{ github.sha }}
            BAUHERR_BUILD_DATE=${{ needs.version.outputs.built }}
          labels: |
            org.opencontainers.image.source=https://github.com/getbauherr/bauherr
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - run: echo "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/digest-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          retention-days: 1

  # Joins the two platform images under the version tag (and latest for a final version).
  image:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the multi-platform tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          repo=ghcr.io/getbauherr/bauherr
          args=(-t "$repo:$VERSION")
          [ "$PRERELEASE" = false ] && args+=(-t "$repo:latest")
          for f in "$RUNNER_TEMP"/digests/digest-*; do args+=("$repo@$(cat "$f")"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$repo:$VERSION"

  npm:
    needs: image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g npm@^11.5.1 && npm --version
      - run: corepack enable
      # Only the CLI's build deps, and no dependency lifecycle scripts while this job holds the OIDC publish identity.
      - run: pnpm install --frozen-lockfile --filter bauherr --ignore-scripts
      - name: Build and publish
        working-directory: packages/cli
        env:
          VERSION: ${{ needs.image.outputs.version }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          # No token env var: OIDC trusted publishing only, never a long-lived npm token.
          unset NODE_AUTH_TOKEN
          npm version "$VERSION" --no-git-tag-version
          pnpm build
          npm stage publish . --provenance --access public --tag "$([ "$PRERELEASE" = true ] && echo next || echo latest)"

  release:
    # a final version publishes its draft GitHub Release when one exists (cut-rc.yml fallback); never creates one
    if: needs.image.outputs.prerelease == 'false'
    needs: [image, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          # drafts are not found by tag, only in the list; an untagged draft keeps only its name
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and (.tag_name == \"$GITHUB_REF_NAME\" or .name == \"$GITHUB_REF_NAME\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true > /dev/null
          else
            echo "::notice::no draft GitHub Release for $GITHUB_REF_NAME to publish"
          fi
