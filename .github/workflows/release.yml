name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Tag commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z[-pre]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BAUHERR_VERSION=${{ steps.v.outputs.version }}
            BAUHERR_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/getbauherr/bauherr:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.prerelease == 'false' && 'ghcr.io/getbauherr/bauherr:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/getbauherr/bauherr
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

  npm:
    needs: image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g npm@^11.5.1 && npm --version
      - run: corepack enable
      # Only the CLI's build deps, and no dependency lifecycle scripts while this job holds the OIDC publish identity.
      - run: pnpm install --frozen-lockfile --filter bauherr --ignore-scripts
      - name: Build and publish
        working-directory: packages/cli
        env:
          VERSION: ${{ needs.image.outputs.version }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          # No token env var: OIDC trusted publishing only, never a long-lived npm token.
          unset NODE_AUTH_TOKEN
          npm version "$VERSION" --no-git-tag-version
          pnpm build
          npm stage publish . --provenance --access public --tag "$([ "$PRERELEASE" = true ] && echo next || echo latest)"
