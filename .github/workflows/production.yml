name: production
# Bauherr's own production: the owner's approval adds `bauherr:approved:production` to the Ticket issue.
# Resolves the Ticket's merge sha (merge of its factory PR, head branch bauherr/<ticket>-*) and reports the check `production` on it. Publishes no image: the change ships with the next release (cut-rc.yml, promote.yml).
on:
  issues:
    types: [labeled]
permissions:
  contents: read
jobs:
  approve:
    if: github.event.label.name == 'bauherr:approved:production' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    # job-level and per issue: one pending run per group, so a shared group drops all but the last of a burst of approvals
    concurrency:
      group: production-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Keep the scripts of main
        run: cp -r .github/scripts "$RUNNER_TEMP/scripts"
      - name: Sender may approve
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          case "$perm" in write|admin) ;; *) echo "::error::$SENDER has $perm access"; exit 1;; esac
      - id: sha
        name: Resolve merge sha
        run: |
          sha=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" | jq -s 'add' | "$RUNNER_TEMP/scripts/merged-sha.sh" "$ISSUE")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Sha must be on main
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          git checkout --detach "$SHA"
      - name: Ships with the next release
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: echo "$SHA ships with the next release (Cut RC, then Promote RC)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report check production
        if: always()
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: "$RUNNER_TEMP/scripts/report-check.sh"
