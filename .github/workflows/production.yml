name: production
# Bauherr's own production: the owner's approval adds `bauherr:approved:production` to the Ticket issue.
# Builds the Ticket's merge sha (merge of its factory PR, head branch bauherr/<ticket>-*), publishes ghcr.io/getbauherr/bauherr:edge and reports the check `production` on that sha.
on:
  issues:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: production-edge
  cancel-in-progress: false

jobs:
  deploy-edge:
    if: github.event.label.name == 'bauherr:approved:production' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      checks: write
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Keep the scripts of main
        run: cp -r .github/scripts "$RUNNER_TEMP/scripts"
      - name: Sender may deploy
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          case "$perm" in write|admin) ;; *) echo "::error::$SENDER has $perm access"; exit 1;; esac
      - id: sha
        name: Resolve merge sha
        run: |
          sha=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" | jq -s 'add' | "$RUNNER_TEMP/scripts/merged-sha.sh" "$ISSUE")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Sha must be on main
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          git checkout --detach "$SHA"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: edge
        name: Move :edge only forward
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          cur=$(docker buildx imagetools inspect ghcr.io/getbauherr/bauherr:edge --format '{{json .Image}}' 2>/dev/null \
            | jq -r '[.. | .config?.Labels?["org.opencontainers.image.revision"]? | select(.)] | first // empty' || true)
          if [ -z "$cur" ] || { git cat-file -e "$cur^{commit}" 2>/dev/null && git merge-base --is-ancestor "$cur" "$SHA"; }; then
            echo "tags=ghcr.io/getbauherr/bauherr:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/getbauherr/bauherr:sha-${{ steps.sha.outputs.sha }}
            ${{ steps.edge.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/getbauherr/bauherr
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
      - name: Report check production
        if: always()
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: "$RUNNER_TEMP/scripts/report-check.sh"
