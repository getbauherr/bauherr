name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: bauherr, POSTGRES_PASSWORD: bauherr, POSTGRES_DB: bauherr}
        ports: ["54330:5432"]
        options: >-
          --health-cmd "pg_isready -U bauherr" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Production-image run without the fake forge (the image refuses it); see e2e-fake for the fake-forge specs.
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: e2e@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Pre-pull the Playwright image while the rest runs
        run: nohup docker pull -q mcr.microsoft.com/playwright:v1.64.1-noble > /dev/null 2>&1 &
      - name: Start the production stack
        run: docker compose up -d --build --wait app
      - name: Seed
        run: |
          echo "E2E_PASSWORD_FILE=$RUNNER_TEMP/e2e-password" >> "$GITHUB_ENV"
          E2E_PASSWORD_FILE=$RUNNER_TEMP/e2e-password
          (umask 077; head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$E2E_PASSWORD_FILE")
          docker compose cp "$E2E_PASSWORD_FILE" app:/tmp/e2e-password
          docker compose exec -T -e E2E_EMAIL -e E2E_PASSWORD_FILE=/tmp/e2e-password app pnpm seed:e2e
      - name: Image refuses the fake forge, even with the marker set at runtime
        run: |
          docker compose run -d --no-deps --name fakecheck -e BAUHERR_E2E_FAKE_FORGE=1 -e BAUHERR_TEST_BUILD=1 -p 3011:3000 app
          status=$(curl --silent --retry 30 --retry-delay 2 --retry-connrefused -o /dev/null -w '%{http_code}' http://localhost:3011/login || true)
          echo "status $status"; docker logs fakecheck 2>&1 | grep -q 'must not be set in production'
          [ "${status:0:1}" != 2 ]
      - if: always()
        run: docker rm -f fakecheck
      - name: Playwright
        run: >
          docker run --rm --network host --ipc=host --user "$(id -u):$(id -g)"
          -v "$PWD:/work" -v "$E2E_PASSWORD_FILE:/pw:ro" -w /work/apps/server
          -e BASE_URL=http://localhost:3000 -e E2E_EMAIL -e E2E_PASSWORD_FILE=/pw -e HOME=/tmp
          mcr.microsoft.com/playwright:v1.64.1-noble npx playwright test --reporter=line,html
      - if: failure()
        run: docker compose logs --no-color app > apps/server/e2e/app.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/server/playwright-report
            apps/server/e2e/results
            apps/server/e2e/app.log
          if-no-files-found: ignore

  e2e-fake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: bauherr, POSTGRES_PASSWORD: bauherr, POSTGRES_DB: bauherr}
        ports: ["54330:5432"]
        options: >-
          --health-cmd "pg_isready -U bauherr" --health-interval 5s --health-retries 10
    env:
      E2E_EMAIL: e2e@example.com
      DATABASE_URL: postgres://bauherr:bauherr@localhost:54330/bauherr
      BAUHERR_E2E_FAKE_FORGE: "1"
      INTAKE_FAKE: "1"
      E2E_FAKE_FORGE: "1"
      OTEL_ENABLED: "0"
      BAUHERR_PACK_DIR: ${{ github.workspace }}/apps/server/tests/fixtures/gated-pack
      E2E_GATED_PACK: "1"
      MEDIA_DIR: /tmp/bauherr-e2e-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: pnpm}
      - name: Pre-pull the Playwright image while the rest runs
        run: nohup docker pull -q mcr.microsoft.com/playwright:v1.64.1-noble > /dev/null 2>&1 &
      - run: pnpm install --frozen-lockfile
      - name: Seed
        run: |
          PAYLOAD_SECRET=$(openssl rand -hex 24); ENCRYPTION_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$PAYLOAD_SECRET"; echo "::add-mask::$ENCRYPTION_KEY"
          echo "PAYLOAD_SECRET=$PAYLOAD_SECRET" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$ENCRYPTION_KEY" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD_FILE=$RUNNER_TEMP/e2e-password" >> "$GITHUB_ENV"
          (umask 077; head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$RUNNER_TEMP/e2e-password")
      - run: pnpm build:packages
      - run: pnpm --filter server gen:migrations
      - name: Build the server (BAUHERR_TEST_BUILD=1 is inlined, so the fake forge is allowed in this build only)
        run: BAUHERR_TEST_BUILD=1 pnpm --filter server build
      - name: Start the server (it migrates on boot, so seed after it is up)
        run: |
          pnpm --filter server start > apps/server/e2e/app.log 2>&1 &
          curl --fail --silent --retry 60 --retry-delay 2 --retry-connrefused -o /dev/null http://localhost:3000/login
      - run: pnpm --filter server seed:e2e
      - name: Playwright
        run: >
          docker run --rm --network host --ipc=host --user "$(id -u):$(id -g)"
          -v "$PWD:/work" -v "$E2E_PASSWORD_FILE:/pw:ro" -w /work/apps/server
          -e BASE_URL=http://localhost:3000 -e E2E_EMAIL -e E2E_PASSWORD_FILE=/pw -e E2E_FAKE_FORGE -e INTAKE_FAKE -e E2E_GATED_PACK -e HOME=/tmp
          mcr.microsoft.com/playwright:v1.64.1-noble npx playwright test --reporter=line,html --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-fake-${{ matrix.shard }}
          path: |
            apps/server/playwright-report
            apps/server/e2e/results
            apps/server/e2e/app.log
          if-no-files-found: ignore

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bauherr test
      - run: pnpm --filter bauherr exec npm pack --dry-run

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Pack the CLI and build the image it pins
        run: |
          pnpm --filter bauherr build
          version=$(node -p "require('./packages/cli/package.json').version")
          (cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP")
          echo "TGZ=$RUNNER_TEMP/bauherr-$version.tgz" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/getbauherr/bauherr:$version" .
      - name: npx init, health, down
        run: |
          dir=$RUNNER_TEMP/smoke
          npx --yes "file:$TGZ" init --yes --dir "$dir" --port 3010
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused -o /dev/null http://localhost:3010/login
          npx --yes "file:$TGZ" status --dir "$dir"
      - if: always()
        run: npx --yes "file:$TGZ" down --volumes --dir "$RUNNER_TEMP/smoke"
