# Envoy front of the vLLM Semantic Router (compose profile `router`). Mirrors the vllm-sr v0.4.0 CLI template
# (src/vllm-sr/cli/templates/envoy.template.yaml) for one listener and one backend: the gateway.
# The router (ExtProc) rewrites the model and selects the route; every route ends in the gateway. No secrets here.
static_resources:
  listeners:
  - name: http-8801
    address: {socket_address: {address: 0.0.0.0, port_value: 8801}}
    perConnectionBufferLimitBytes: 524288000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          stream_idle_timeout: 300s
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              request_headers_to_remove: [x-vsr-looper-request, x-vsr-looper-secret, x-vsr-looper-decision, x-vsr-looper-iteration, x-authz-user-id, x-authz-user-groups]
              routes:
              - match: {prefix: "/"}
                route: {cluster: gateway_cluster, timeout: 300s, host_rewrite_literal: "gateway:4000"}
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              allow_mode_override: true
              grpc_service: {envoy_grpc: {cluster_name: extproc_service}}
              processing_mode: {request_header_mode: SEND, response_header_mode: SEND, request_body_mode: BUFFERED, response_body_mode: BUFFERED}
              message_timeout: 300s
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: extproc_service
    connect_timeout: 10s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: extproc_service
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: router-core, port_value: 50051}}}}]}]
  - name: gateway_cluster
    connect_timeout: 10s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: gateway_cluster
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: gateway, port_value: 4000}}}}]}]
