# Jaeger 2 all-in-one for the `observability` profile: OTLP in, in-memory storage out.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: info

extensions:
  jaeger_query:
    base_path: /-/traces # the Bauherr Admin proxy serves Jaeger under this prefix
    storage:
      traces: memory_store
  jaeger_storage:
    backends:
      memory_store:
        memory:
          max_traces: 50000 # oldest traces are evicted beyond this; restart clears all
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store
