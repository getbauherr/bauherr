# The plan stage as Jobs: the plan Run, a non-blocking agent-experience scan, the Bauherr's approval. Used by tests/plan-jobs.test.ts.
version: 1
team:
  roles:
    orchestrator: {title: Orchestrator, tier: cheap}
    engineer:     {title: Software engineer, tier: cheap}
    reviewer:     {title: Reviewer, tier: standard}
    ax:           {title: Agent experience engineer, tier: standard}
workflow:
  stages:
    - {name: triage, kind: triage, role: orchestrator, skill: triage, outcomes: {plan: plan, refine: triage, skip: backlog}}
    - name: plan
      kind: plan
      role: engineer
      skill: run-contract
      wip: 3
      jobs:
        - {id: plan}
        - {id: ax-scan, role: ax, skill: ux-review, needs: [plan], blocking: false, outcomes: {pass: done, findings: done}}
        - {id: approve, kind: human, by: bauherr, needs: [plan, ax-scan]}
      outcomes: {done: build, split: parent, decisions: triage}
    - {name: parent, kind: container, title: Split, outcomes: {children_done: done}}
    - {name: build, kind: build, role: engineer, skill: run-contract, wip: 2, outcomes: {done: review, stuck: escalate, replan: plan}}
    - {name: review, kind: review, role: reviewer, skill: review, wip: 3, outcomes: {clean: release, changes: build, stop: triage}}
    - {name: release, kind: release, title: Staging, wip: 5, outcomes: {accepted: done, changes: build}}
    - {name: done, kind: done}
