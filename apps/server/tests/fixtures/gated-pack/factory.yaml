# Both optional gates on: Approve plan and Accept on staging. No production gate (production_gate off).
version: 1
team:
  roles:
    orchestrator: {title: Orchestrator, tier: cheap}
    engineer:     {title: Software engineer, skills: [TypeScript, Small diffs], tier: cheap}
    reviewer:     {title: Reviewer, tier: standard}
workflow:
  stages:
    - {name: triage, kind: triage, role: orchestrator, skill: triage, outcomes: {plan: plan, refine: triage, skip: backlog}}
    - {name: plan, kind: plan, role: engineer, skill: run-contract, gate: human, wip: 3, outcomes: {done: build, split: parent, decisions: triage}}
    - {name: parent, kind: container, title: Split, outcomes: {children_done: done}}
    - {name: build, kind: build, role: engineer, skill: run-contract, wip: 2, outcomes: {done: review, stuck: escalate, replan: plan}}
    - {name: review, kind: review, role: reviewer, skill: review, wip: 3, outcomes: {clean: release, changes: build, stop: triage}}
    - {name: release, kind: release, title: Staging, gate: human, wip: 5, outcomes: {accepted: done, changes: build}}
    - {name: done, kind: done}
